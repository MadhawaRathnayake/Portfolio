name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Must be lowercase: Docker rejects capitals in image names, and the
  # GitHub repo is "MadhawaRathnayake/Portfolio".
  IMAGE_NAME: madhawarathnayake/portfolio

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure VM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'REMOTE'
            set -e
            cd ~/portfolio
            docker compose pull
            docker compose up -d
            docker image prune -f
          REMOTE

      - name: Verify the site is up
        run: |
          # SITE_URL includes the scheme, e.g. http://20.30.40.50 or https://madhawa.dev
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.SITE_URL }}/api/health || true)
            if [ "$code" = "200" ]; then echo "Healthy"; exit 0; fi
            echo "Attempt $i: got $code, retrying"; sleep 5
          done
          echo "Site did not come back healthy"; exit 1
